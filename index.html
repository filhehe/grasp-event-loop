      <article>
        <h1>Grasp Event Loop — визуализатор JavaScript event loop</h1>
        <p>
          Grasp Event Loop показывает, в каком порядке JavaScript выполняет код. На одном экране редактор, консоль и схема:
          Call Stack, Web API, Event Loop, очередь макрозадач и очередь микрозадач.
        </p>
        <p>
          Так разбирают вопрос с собеседования «что выведет этот код»: не по памяти, а по тому, как задача проходит через
          стек и очереди. Синхронный код выполняется сразу. setTimeout и setInterval ждут в Web API. then, catch, finally,
          queueMicrotask и продолжение после await попадают в микрозадачи и выполняются раньше любой макрозадачи.
        </p>
        <p>
          В списке 68 примеров, от простого к собеседованию: вложенные вызовы, задержка 0 мс, Promise, async/await,
          try/catch, let и var в цикле, Promise.all, Promise.race, Promise.allSettled, debounce и throttle. Свой код можно
          запустить тем же пошаговым прогоном.
        </p>
        <p>Чтобы пользоваться визуализатором, включите JavaScript.</p>
